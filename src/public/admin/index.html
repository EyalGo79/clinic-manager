<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קליניקת גולן — לוח מחוונים</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ===== Revenue chart ===== */
    .viz-root {
      --surface-1:    #fcfcfb;
      --series-1:     #2a78d6;
      --series-1-dim: #a8c8f5;
      --text-pri:     #0b0b0b;
      --text-sec:     #52514e;
      --text-muted:   #898781;
      --grid:         #e1e0d9;
      --baseline:     #c3c2b7;
      --tooltip-bg:   #ffffff;
      --tooltip-bdr:  rgba(11,11,11,0.12);
    }
    @media (prefers-color-scheme: dark) {
      .viz-root {
        --surface-1:    #1a1a19;
        --series-1:     #3987e5;
        --series-1-dim: #1c4a8c;
        --text-pri:     #ffffff;
        --text-sec:     #c3c2b7;
        --text-muted:   #898781;
        --grid:         #2c2c2a;
        --baseline:     #383835;
        --tooltip-bg:   #2a2a28;
        --tooltip-bdr:  rgba(255,255,255,0.12);
      }
    }
    .chart-card { position:relative; }
    .chart-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
    }
    #revenueChart {
      display: block;
      width: 100%;
      overflow: visible;
    }
    .chart-tooltip {
      position: absolute;
      background: var(--tooltip-bg);
      border: 1px solid var(--tooltip-bdr);
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .1s;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
      z-index: 10;
    }
    .chart-tooltip.visible { opacity: 1; }
    .chart-tooltip .tt-label { color: var(--text-sec); margin-bottom: 2px; font-size: 12px; }
    .chart-tooltip .tt-value { color: var(--text-pri); font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo"><span>🏥</span>קליניקת גולן</div>
    <nav>
      <a href="/admin/index.html" class="active"><span class="icon">📊</span>לוח מחוונים</a>
      <a href="/admin/schedule.html"><span class="icon">📅</span>לוח זמנים</a>
      <a href="/admin/therapists.html"><span class="icon">👥</span>מטפלים</a>
      <a href="/admin/contracts.html"><span class="icon">📋</span>ססיות</a>
      <a href="/admin/billing.html"><span class="icon">💰</span>חיובים</a>
      <a href="/admin/settings.html"><span class="icon">⚙️</span>הגדרות</a>
    </nav>
      <form action="/auth/logout" method="post" style="display:contents;"><button class="sidebar-logout-mobile" type="submit"><span class="icon">🚪</span>יציאה</button></form>
    <div class="sidebar-user">
      <div class="name" id="userName">...</div>
      <div class="role">מנהל</div>
      <form action="/auth/logout" method="post">
        <button class="btn-logout" type="submit">יציאה</button>
      </form>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h2>לוח מחוונים</h2>
      <div id="todayDate" style="color:#718096;font-size:14px;"></div>
    </div>

    <div class="content">

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">מטפלים פעילים</div>
          <div class="value" id="statTherapists">—</div>
        </div>
        <div class="stat-card">
          <div class="label">פגישות החודש</div>
          <div class="value" id="statSessions">—</div>
        </div>
        <div class="stat-card">
          <div class="label">שעות החודש</div>
          <div class="value" id="statHours">—</div>
        </div>
        <div class="stat-card">
          <div class="label">הכנסות החודש</div>
          <div class="value" id="statRevenue">—</div>
          <div class="sub">מוערך</div>
        </div>
      </div>

      <!-- גרף הכנסות -->
      <div class="card chart-card viz-root" style="margin-bottom:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="font-size:16px;">הכנסות חודשיות</h3>
          <span id="chartRange" style="font-size:12px;color:#718096;"></span>
        </div>
        <div class="chart-wrap" id="chartWrap">
          <svg id="revenueChart" aria-label="גרף הכנסות חודשיות"></svg>
          <div class="chart-tooltip" id="chartTooltip">
            <div class="tt-label" id="ttLabel"></div>
            <div class="tt-value" id="ttValue"></div>
          </div>
        </div>
        <div id="chartEmpty" style="display:none;text-align:center;color:#718096;padding:32px 0;font-size:14px;">אין נתונים זמינים</div>
      </div>

      <!-- פגישות היום -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="font-size:16px;">פגישות היום</h3>
          <a href="/admin/schedule.html" class="btn btn-ghost btn-sm">לוח זמנים מלא</a>
        </div>
        <div id="todaySessions"><div class="loading">טוען...</div></div>
      </div>

      <!-- סינק גוגל קאלנדר -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="font-size:16px;">גוגל קאלנדר</h3>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="deduplicateSessions()" id="dedupeBtn" title="מחק פגישות כפולות מהמסד">
              🧹 נקה כפילויות
            </button>
            <button class="btn btn-primary btn-sm" onclick="syncCalendar()" id="syncBtn">
              🔄 סנכרן עכשיו
            </button>
          </div>
        </div>
        <div id="syncStatus" style="font-size:13px;color:#718096;">לא בוצע סינק עדיין</div>
      </div>

    </div>
  </div>
</div>

<script>
  // תאריך היום
  const now = new Date();
  document.getElementById('todayDate').textContent = now.toLocaleDateString('he-IL', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  // שם משתמש — טען הכל רק אחרי שה-auth מאושר
  fetch('/auth/me').then(r => {
    if (!r.ok) { window.location.href = '/login'; return null; }
    return r.json();
  }).then(u => {
    if (!u) return;
    document.getElementById('userName').textContent = u.name || u.email;
    loadStats();
    loadTodaySessions();
    loadRevenueChart();
  });

  // טעינת stats
  async function loadStats() {
    const year = now.getFullYear();
    const month = now.getMonth() + 1;

    try {
      const [therapistsRes, summaryRes] = await Promise.all([
        fetch('/api/therapists'),
        fetch(`/api/billing/summary/${year}/${month}`),
      ]);
      const therapists = await therapistsRes.json();
      const summary = await summaryRes.json();

      document.getElementById('statTherapists').textContent = therapists.length;

      const totalHours = summary.therapists.reduce((s, t) => s + t.totalHours, 0);
      const totalRevenue = summary.therapists.reduce((s, t) => s + t.totalAmount, 0);
      document.getElementById('statHours').textContent = totalHours.toFixed(1);
      document.getElementById('statRevenue').textContent =
        '₪' + totalRevenue.toLocaleString('he-IL', { maximumFractionDigits: 0 });
    } catch (e) {
      console.error(e);
    }
  }

  // פגישות היום
  async function loadTodaySessions() {
    const from = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    const to = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59).toISOString();

    try {
      const res = await fetch(`/api/sessions?from=${from}&to=${to}`);
      const sessions = await res.json();
      const el = document.getElementById('todaySessions');
      const visible = sessions.filter(s => s.status === 'confirmed' || s.status === 'cancelled_charged');

      document.getElementById('statSessions').textContent = sessions.filter(s => s.status === 'confirmed').length;

      if (!visible.length) {
        el.innerHTML = '<div style="color:#718096;font-size:14px;padding:8px 0;">אין פגישות היום</div>';
        return;
      }

      el.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>שעה</th><th>מטפל</th><th>משך</th><th>סטטוס</th>
            </tr></thead>
            <tbody>
              ${visible.map(s => {
                const start = new Date(s.start_time);
                const end = new Date(s.end_time);
                const hours = ((end - start) / 3600000).toFixed(1);
                const timeStr = start.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) +
                  ' – ' + end.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
                const badge = s.status === 'confirmed'
                  ? '<span class="badge badge-green">מאושר</span>'
                  : s.status === 'cancelled_charged'
                  ? '<span class="badge badge-yellow">בוטל (מחויב)</span>'
                  : '<span class="badge badge-gray">בוטל</span>';
                return `<tr>
                  <td>${timeStr}</td>
                  <td>${s.therapist_name || '—'}</td>
                  <td>${hours} ש'</td>
                  <td>${badge}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    } catch (e) {
      document.getElementById('todaySessions').innerHTML =
        '<div style="color:#e53e3e;font-size:14px;">שגיאה בטעינה</div>';
    }
  }

  // גרף הכנסות — 12 חודשים אחורה
  async function loadRevenueChart() {
    const months = [];
    const d = new Date(now.getFullYear(), now.getMonth(), 1);
    for (let i = 11; i >= 0; i--) {
      const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
      months.push({ year: m.getFullYear(), month: m.getMonth() + 1 });
    }

    let results;
    try {
      results = await Promise.all(
        months.map(({ year, month }) =>
          fetch(`/api/billing/summary/${year}/${month}`)
            .then(r => r.ok ? r.json() : { therapists: [] })
            .catch(() => ({ therapists: [] }))
        )
      );
    } catch (e) { return; }

    const MONTHS_HE = ['ינו','פבר','מרץ','אפר','מאי','יוני','יולי','אוג','ספט','אוק','נוב','דצמ'];
    const data = months.map(({ year, month }, i) => ({
      label: MONTHS_HE[month - 1] + ' ' + String(year).slice(2),
      amount: (results[i].therapists || []).reduce((s, t) => s + (t.totalAmount || 0), 0),
      year, month,
    }));

    const hasData = data.some(d => d.amount > 0);
    if (!hasData) {
      document.getElementById('revenueChart').style.display = 'none';
      document.getElementById('chartEmpty').style.display = '';
      return;
    }

    // טווח תצוגה בכותרת
    document.getElementById('chartRange').textContent =
      data[0].label + ' – ' + data[data.length - 1].label;

    drawRevenueChart(data);
  }

  function drawRevenueChart(data) {
    const wrap = document.getElementById('chartWrap');
    const svg  = document.getElementById('revenueChart');
    const tooltip = document.getElementById('chartTooltip');

    const W = wrap.clientWidth || 600;
    const H = Math.round(W * 0.38);           // aspect ~2.6:1
    const PAD = { top: 24, right: 16, bottom: 40, left: 64 };
    const plotW = W - PAD.left - PAD.right;
    const plotH = H - PAD.top - PAD.bottom;

    const maxAmt = Math.max(...data.map(d => d.amount));
    const yMax   = Math.ceil(maxAmt / 1000) * 1000 || 1000;
    const BAR_W  = Math.min(24, Math.floor(plotW / data.length * 0.55));
    const BAR_GAP = plotW / data.length;

    const xPos = i => PAD.left + BAR_GAP * i + BAR_GAP / 2;
    const yPos = v => PAD.top + plotH - (v / yMax) * plotH;

    // Y gridlines — 4 ticks
    const tickCount = 4;
    const tickStep  = yMax / tickCount;
    let gridLines = '';
    let yLabels   = '';
    for (let t = 0; t <= tickCount; t++) {
      const val = t * tickStep;
      const y   = yPos(val);
      gridLines += `<line x1="${PAD.left}" x2="${W - PAD.right}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
      const label = val >= 1000 ? (val / 1000).toLocaleString('he-IL') + 'K' : val;
      yLabels += `<text x="${PAD.left - 8}" y="${y + 4}" text-anchor="end" fill="var(--text-muted)" font-size="11" font-variant-numeric="tabular-nums">${label}</text>`;
    }

    // baseline
    const baseline = `<line x1="${PAD.left}" x2="${W - PAD.right}" y1="${yPos(0)}" y2="${yPos(0)}" stroke="var(--baseline)" stroke-width="1"/>`;

    // עמודות + תוויות ציר X
    let bars   = '';
    let xLabels = '';
    data.forEach((d, i) => {
      const x   = xPos(i) - BAR_W / 2;
      const y   = yPos(d.amount);
      const h   = yPos(0) - y;
      const rx  = Math.min(4, BAR_W / 2);
      // עמודה עם קצה עליון מעוגל
      bars += `
        <rect class="rev-bar" data-i="${i}"
          x="${x}" y="${y}" width="${BAR_W}" height="${h}"
          rx="${rx}" ry="${rx}"
          fill="var(--series-1)" style="cursor:pointer;transition:fill .1s;"
          tabindex="0" role="img" aria-label="${d.label}: ₪${Math.round(d.amount).toLocaleString('he-IL')}"/>`;
      // clip bottom corners — overlay rect to square the base
      if (h > rx) {
        bars += `<rect x="${x}" y="${yPos(0) - rx}" width="${BAR_W}" height="${rx}" fill="var(--series-1)" data-base="${i}"/>`;
      }
      xLabels += `<text x="${xPos(i)}" y="${yPos(0) + 16}" text-anchor="middle" fill="var(--text-muted)" font-size="11">${d.label}</text>`;
    });

    // crosshair (hidden)
    const crosshair = `<line id="crosshair" x1="0" x2="0" y1="${PAD.top}" y2="${yPos(0)}" stroke="var(--baseline)" stroke-width="1" stroke-dasharray="4 3" opacity="0" pointer-events="none"/>`;

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('height', H);
    svg.innerHTML = gridLines + baseline + crosshair + bars + yLabels + xLabels;

    // interaction — hover tooltip
    const fmtILS = n => '₪' + Math.round(n).toLocaleString('he-IL');

    function showTip(i, barEl) {
      const d = data[i];
      document.getElementById('ttLabel').textContent = d.label;
      document.getElementById('ttValue').textContent = fmtILS(d.amount);
      tooltip.classList.add('visible');

      const svgRect = svg.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      const bRect = barEl.getBoundingClientRect();
      let left = bRect.left - wrapRect.left + bRect.width / 2;
      const top  = bRect.top  - wrapRect.top - tooltip.offsetHeight - 8;
      // clamp להישאר בתוך ה-wrap
      const ttW = tooltip.offsetWidth || 120;
      left = Math.max(4, Math.min(left - ttW / 2, wrap.clientWidth - ttW - 4));
      tooltip.style.left = left + 'px';
      tooltip.style.top  = Math.max(4, top) + 'px';

      // crosshair
      const ch = svg.getElementById('crosshair');
      ch.setAttribute('x1', xPos(i));
      ch.setAttribute('x2', xPos(i));
      ch.setAttribute('opacity', '1');

      // הדגש עמודה
      svg.querySelectorAll('.rev-bar').forEach((b, j) => {
        b.setAttribute('fill', j == i ? 'var(--series-1)' : 'var(--series-1-dim)');
      });
      svg.querySelectorAll('[data-base]').forEach(b => {
        b.setAttribute('fill', parseInt(b.dataset.base) == i ? 'var(--series-1)' : 'var(--series-1-dim)');
      });
    }

    function hideTip() {
      tooltip.classList.remove('visible');
      svg.getElementById('crosshair').setAttribute('opacity', '0');
      svg.querySelectorAll('.rev-bar,[data-base]').forEach(b => b.setAttribute('fill', 'var(--series-1)'));
    }

    svg.querySelectorAll('.rev-bar').forEach(bar => {
      const i = parseInt(bar.dataset.i);
      bar.addEventListener('pointerenter', () => showTip(i, bar));
      bar.addEventListener('pointermove',  () => showTip(i, bar));
      bar.addEventListener('pointerleave', hideTip);
      bar.addEventListener('focus',        () => showTip(i, bar));
      bar.addEventListener('blur',         hideTip);
    });

    // redraw on resize
    if (!svg._resizeObserver) {
      svg._resizeObserver = new ResizeObserver(() => {
        if (wrap.clientWidth !== W) drawRevenueChart(data);
      });
      svg._resizeObserver.observe(wrap);
    }
  }

  async function syncCalendar() {
    const btn = document.getElementById('syncBtn');
    const status = document.getElementById('syncStatus');
    btn.disabled = true;
    btn.textContent = '⏳ מסנכרן...';
    try {
      const [syncRes, pushRes] = await Promise.all([
        fetch('/api/calendar/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(r => r.json()),
        fetch('/api/calendar/push', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(r => r.json()),
      ]);
      if (syncRes.success) {
        const dedupeRes = await fetch('/api/calendar/deduplicate', { method: 'POST' }).then(r => r.json());
        const removedMsg = dedupeRes.removed > 0 ? `, נוקו ${dedupeRes.removed} כפילויות` : '';
        status.textContent = `סונכרן בהצלחה — יובאו ${syncRes.imported}, נדחפו ${pushRes.pushed ?? 0}${removedMsg}`;
        status.style.color = '#276749';
        loadTodaySessions();
      } else {
        status.textContent = 'שגיאה בסינק: ' + (syncRes.error || 'לא ידוע');
        status.style.color = '#e53e3e';
      }
    } catch (e) {
      status.textContent = 'שגיאת רשת';
      status.style.color = '#e53e3e';
    }
    btn.disabled = false;
    btn.textContent = '🔄 סנכרן עכשיו';
  }

  async function deduplicateSessions() {
    const btn = document.getElementById('dedupeBtn');
    const status = document.getElementById('syncStatus');
    btn.disabled = true;
    btn.textContent = '⏳ בודק...';
    try {
      const res = await fetch('/api/calendar/deduplicate', { method: 'POST' }).then(r => r.json());
      if (res.success) {
        status.textContent = res.removed > 0
          ? `נוקו ${res.removed} פגישות כפולות (${res.groups} קבוצות)`
          : 'לא נמצאו כפילויות';
        status.style.color = res.removed > 0 ? '#276749' : '#718096';
        if (res.removed > 0) loadTodaySessions();
      } else {
        status.textContent = 'שגיאה: ' + (res.error || 'לא ידוע');
        status.style.color = '#e53e3e';
      }
    } catch (e) {
      status.textContent = 'שגיאת רשת';
      status.style.color = '#e53e3e';
    }
    btn.disabled = false;
    btn.textContent = '🧹 נקה כפילויות';
  }
</script>
</body>
</html>
