<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קליניקת גולן — לוח מחוונים</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ===== Revenue chart ===== */
    .viz-root {
      --surface-1:    #fcfcfb;
      --text-pri:     #0b0b0b;
      --text-sec:     #52514e;
      --text-muted:   #898781;
      --grid:         #e1e0d9;
      --baseline:     #c3c2b7;
      --tooltip-bg:   #ffffff;
      --tooltip-bdr:  rgba(11,11,11,0.12);
      /* 8 categorical slots — validated adjacent light+dark */
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
      --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    }
    @media (prefers-color-scheme: dark) {
      .viz-root {
        --surface-1:    #1a1a19;
        --text-pri:     #ffffff;
        --text-sec:     #c3c2b7;
        --text-muted:   #898781;
        --grid:         #2c2c2a;
        --baseline:     #383835;
        --tooltip-bg:   #2a2a28;
        --tooltip-bdr:  rgba(255,255,255,0.12);
        --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
        --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      }
    }
    .chart-card { position: relative; }
    .chart-wrap { position: relative; width: 100%; overflow: hidden; }
    #revenueChart { display: block; width: 100%; overflow: visible; }
    .chart-tooltip {
      position: absolute;
      background: var(--tooltip-bg);
      border: 1px solid var(--tooltip-bdr);
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .1s;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
      z-index: 10;
      min-width: 140px;
    }
    .chart-tooltip.visible { opacity: 1; }
    .chart-tooltip .tt-month { color: var(--text-sec); font-size: 12px; margin-bottom: 6px; font-weight: 600; }
    .chart-tooltip .tt-row { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 3px; }
    .chart-tooltip .tt-row:last-child { margin-bottom: 0; }
    .chart-tooltip .tt-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .chart-tooltip .tt-name { color: var(--text-sec); flex: 1; }
    .chart-tooltip .tt-val { color: var(--text-pri); font-weight: 700; }
    .chart-tooltip .tt-total {
      border-top: 1px solid var(--grid, #e1e0d9);
      margin-top: 5px; padding-top: 5px;
      display: flex; justify-content: space-between;
      font-size: 13px; font-weight: 700; color: var(--text-pri);
    }
    /* legend */
    .chart-legend {
      display: flex; flex-wrap: wrap; gap: 6px 14px;
      margin-top: 12px; font-size: 12px; color: var(--text-sec);
    }
    .chart-legend-item { display: flex; align-items: center; gap: 5px; }
    .chart-legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
  </style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo"><span>🏥</span>קליניקת גולן</div>
    <nav>
      <a href="/admin/index.html" class="active"><span class="icon">📊</span>לוח מחוונים</a>
      <a href="/admin/schedule.html"><span class="icon">📅</span>לוח זמנים</a>
      <a href="/admin/therapists.html"><span class="icon">👥</span>מטפלים</a>
      <a href="/admin/contracts.html"><span class="icon">📋</span>ססיות</a>
      <a href="/admin/billing.html"><span class="icon">💰</span>חיובים</a>
      <a href="/admin/settings.html"><span class="icon">⚙️</span>הגדרות</a>
    </nav>
      <form action="/auth/logout" method="post" style="display:contents;"><button class="sidebar-logout-mobile" type="submit"><span class="icon">🚪</span>יציאה</button></form>
    <div class="sidebar-user">
      <div class="name" id="userName">...</div>
      <div class="role">מנהל</div>
      <form action="/auth/logout" method="post">
        <button class="btn-logout" type="submit">יציאה</button>
      </form>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h2>לוח מחוונים</h2>
      <div id="todayDate" style="color:#718096;font-size:14px;"></div>
    </div>

    <div class="content">

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">מטפלים פעילים</div>
          <div class="value" id="statTherapists">—</div>
        </div>
        <div class="stat-card">
          <div class="label">פגישות החודש</div>
          <div class="value" id="statSessions">—</div>
        </div>
        <div class="stat-card">
          <div class="label">שעות החודש</div>
          <div class="value" id="statHours">—</div>
        </div>
        <div class="stat-card">
          <div class="label">הכנסות החודש</div>
          <div class="value" id="statRevenue">—</div>
          <div class="sub">מוערך</div>
        </div>
      </div>

      <!-- גרף הכנסות -->
      <div class="card chart-card viz-root" style="margin-bottom:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="font-size:16px;">הכנסות חודשיות</h3>
          <span id="chartRange" style="font-size:12px;color:#718096;"></span>
        </div>
        <div class="chart-wrap" id="chartWrap">
          <svg id="revenueChart" aria-label="גרף הכנסות חודשיות לפי מטפל"></svg>
          <div class="chart-tooltip" id="chartTooltip"></div>
        </div>
        <div class="chart-legend" id="chartLegend"></div>
        <div id="chartEmpty" style="display:none;text-align:center;color:#718096;padding:32px 0;font-size:14px;">אין נתונים זמינים</div>
      </div>

      <!-- פגישות היום -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="font-size:16px;">פגישות היום</h3>
          <a href="/admin/schedule.html" class="btn btn-ghost btn-sm">לוח זמנים מלא</a>
        </div>
        <div id="todaySessions"><div class="loading">טוען...</div></div>
      </div>

      <!-- סינק גוגל קאלנדר -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="font-size:16px;">גוגל קאלנדר</h3>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="deduplicateSessions()" id="dedupeBtn" title="מחק פגישות כפולות מהמסד">
              🧹 נקה כפילויות
            </button>
            <button class="btn btn-primary btn-sm" onclick="syncCalendar()" id="syncBtn">
              🔄 סנכרן עכשיו
            </button>
          </div>
        </div>
        <div id="syncStatus" style="font-size:13px;color:#718096;">לא בוצע סינק עדיין</div>
      </div>

    </div>
  </div>
</div>

<script>
  // תאריך היום
  const now = new Date();
  document.getElementById('todayDate').textContent = now.toLocaleDateString('he-IL', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  // שם משתמש — טען הכל רק אחרי שה-auth מאושר
  fetch('/auth/me').then(r => {
    if (!r.ok) { window.location.href = '/login'; return null; }
    return r.json();
  }).then(u => {
    if (!u) return;
    document.getElementById('userName').textContent = u.name || u.email;
    loadStats();
    loadTodaySessions();
    loadRevenueChart();
  });

  // טעינת stats
  async function loadStats() {
    const year = now.getFullYear();
    const month = now.getMonth() + 1;

    try {
      const [therapistsRes, summaryRes] = await Promise.all([
        fetch('/api/therapists'),
        fetch(`/api/billing/summary/${year}/${month}`),
      ]);
      const therapists = await therapistsRes.json();
      const summary = await summaryRes.json();

      document.getElementById('statTherapists').textContent = therapists.length;

      const totalHours = summary.therapists.reduce((s, t) => s + t.totalHours, 0);
      const totalRevenue = summary.therapists.reduce((s, t) => s + t.totalAmount, 0);
      document.getElementById('statHours').textContent = totalHours.toFixed(1);
      document.getElementById('statRevenue').textContent =
        '₪' + totalRevenue.toLocaleString('he-IL', { maximumFractionDigits: 0 });
    } catch (e) {
      console.error(e);
    }
  }

  // פגישות היום
  async function loadTodaySessions() {
    const from = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    const to = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59).toISOString();

    try {
      const res = await fetch(`/api/sessions?from=${from}&to=${to}`);
      const sessions = await res.json();
      const el = document.getElementById('todaySessions');
      const visible = sessions.filter(s => s.status === 'confirmed' || s.status === 'cancelled_charged');

      document.getElementById('statSessions').textContent = sessions.filter(s => s.status === 'confirmed').length;

      if (!visible.length) {
        el.innerHTML = '<div style="color:#718096;font-size:14px;padding:8px 0;">אין פגישות היום</div>';
        return;
      }

      el.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>שעה</th><th>מטפל</th><th>משך</th><th>סטטוס</th>
            </tr></thead>
            <tbody>
              ${visible.map(s => {
                const start = new Date(s.start_time);
                const end = new Date(s.end_time);
                const hours = ((end - start) / 3600000).toFixed(1);
                const timeStr = start.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) +
                  ' – ' + end.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
                const badge = s.status === 'confirmed'
                  ? '<span class="badge badge-green">מאושר</span>'
                  : s.status === 'cancelled_charged'
                  ? '<span class="badge badge-yellow">בוטל (מחויב)</span>'
                  : '<span class="badge badge-gray">בוטל</span>';
                return `<tr>
                  <td>${timeStr}</td>
                  <td>${s.therapist_name || '—'}</td>
                  <td>${hours} ש'</td>
                  <td>${badge}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    } catch (e) {
      document.getElementById('todaySessions').innerHTML =
        '<div style="color:#e53e3e;font-size:14px;">שגיאה בטעינה</div>';
    }
  }

  // גרף הכנסות — 12 חודשים אחורה, חלוקה לפי מטפל
  const SLOT_COLORS_LIGHT = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
  const SLOT_COLORS_DARK  = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];

  function slotColors() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches
      ? SLOT_COLORS_DARK : SLOT_COLORS_LIGHT;
  }

  async function loadRevenueChart() {
    const months = [];
    const d = new Date(now.getFullYear(), now.getMonth(), 1);
    for (let i = 11; i >= 0; i--) {
      const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
      months.push({ year: m.getFullYear(), month: m.getMonth() + 1 });
    }

    let results;
    try {
      results = await Promise.all(
        months.map(({ year, month }) =>
          fetch(`/api/billing/summary/${year}/${month}`)
            .then(r => r.ok ? r.json() : { therapists: [] })
            .catch(() => ({ therapists: [] }))
        )
      );
    } catch (e) { return; }

    const MONTHS_HE = ['ינו','פבר','מרץ','אפר','מאי','יוני','יולי','אוג','ספט','אוק','נוב','דצמ'];

    // אסוף את כל שמות המטפלים (לפי סדר הופעה ראשון)
    const therapistOrder = [];
    const therapistNames = {};
    results.forEach(r => {
      (r.therapists || []).forEach(t => {
        if (!therapistNames[t.id]) {
          therapistNames[t.id] = t.name;
          therapistOrder.push(t.id);
        }
      });
    });

    // מגבילים ל-8 מטפלים — שאר מתמזגים ל"אחרים"
    const MAX_SERIES = 8;
    const mainIds   = therapistOrder.slice(0, MAX_SERIES - (therapistOrder.length > MAX_SERIES ? 1 : 0));
    const hasOther  = therapistOrder.length > MAX_SERIES;
    const seriesIds = hasOther ? [...mainIds.slice(0, MAX_SERIES - 1), '__other__'] : mainIds;
    const seriesNames = seriesIds.map(id => id === '__other__' ? 'אחרים' : therapistNames[id]);

    // בנה data לפי חודש
    const data = months.map(({ year, month }, i) => {
      const tMap = {};
      (results[i].therapists || []).forEach(t => { tMap[t.id] = t.totalAmount || 0; });
      const segments = seriesIds.map(id => {
        if (id === '__other__') {
          return therapistOrder.slice(MAX_SERIES - 1).reduce((s, oid) => s + (tMap[oid] || 0), 0);
        }
        return tMap[id] || 0;
      });
      return {
        label: MONTHS_HE[month - 1] + ' ' + String(year).slice(2),
        segments,
        total: segments.reduce((s, v) => s + v, 0),
        year, month,
      };
    });

    const hasData = data.some(d => d.total > 0);
    if (!hasData) {
      document.getElementById('revenueChart').style.display = 'none';
      document.getElementById('chartEmpty').style.display   = '';
      return;
    }

    document.getElementById('chartRange').textContent =
      data[0].label + ' – ' + data[data.length - 1].label;

    // legend
    const colors = slotColors();
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const legendEl = document.getElementById('chartLegend');
    legendEl.innerHTML = seriesIds.map((id, si) =>
      `<div class="chart-legend-item">
        <div class="chart-legend-swatch" style="background:${colors[si % colors.length]}"></div>
        <span>${esc(seriesNames[si])}</span>
      </div>`
    ).join('');

    const isMobile = wrap.clientWidth < 500;
    if (isMobile) {
      document.getElementById('chartLegend').innerHTML = '';
      drawRevenueChart(data, ['__total__'], ['סה"כ']);
    } else {
      drawRevenueChart(data, seriesIds, seriesNames);
    }
  }

  function drawRevenueChart(data, seriesIds, seriesNames) {
    const wrap    = document.getElementById('chartWrap');
    const svg     = document.getElementById('revenueChart');
    const tooltip = document.getElementById('chartTooltip');
    const isMobile = seriesIds.length === 1 && seriesIds[0] === '__total__';
    const colors  = isMobile ? [slotColors()[0]] : slotColors();
    const SURFACE = window.matchMedia('(prefers-color-scheme: dark)').matches ? '#1a1a19' : '#fcfcfb';
    const GAP     = 2; // 2px surface gap between stacked segments

    const W      = wrap.clientWidth || 600;
    const H      = Math.round(W * 0.40);
    const PAD    = { top: 24, right: 16, bottom: 40, left: 64 };
    const plotW  = W - PAD.left - PAD.right;
    const plotH  = H - PAD.top - PAD.bottom;
    const BAR_W  = Math.min(24, Math.floor(plotW / data.length * 0.55));
    const BAR_GAP = plotW / data.length;

    const maxAmt = Math.max(...data.map(d => d.total));
    const yMax   = Math.ceil(maxAmt / 1000) * 1000 || 1000;

    const xPos = i => PAD.left + BAR_GAP * i + BAR_GAP / 2;
    const yPos = v => PAD.top + plotH - (v / yMax) * plotH;
    const fmtILS = n => '₪' + Math.round(n).toLocaleString('he-IL');

    // gridlines + Y labels
    const tickCount = 4;
    let gridLines = '', yLabels = '';
    for (let t = 0; t <= tickCount; t++) {
      const val = t * (yMax / tickCount);
      const y   = yPos(val);
      gridLines += `<line x1="${PAD.left}" x2="${W - PAD.right}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
      const lbl  = val >= 1000 ? (val / 1000).toLocaleString('he-IL') + 'K' : val;
      yLabels   += `<text x="${PAD.left - 8}" y="${y + 4}" text-anchor="end" fill="var(--text-muted)" font-size="11" font-variant-numeric="tabular-nums">${lbl}</text>`;
    }
    const baseline = `<line x1="${PAD.left}" x2="${W - PAD.right}" y1="${yPos(0)}" y2="${yPos(0)}" stroke="var(--baseline)" stroke-width="1"/>`;

    // stacked bars
    let bars = '', xLabels = '';
    data.forEach((col, i) => {
      let cumulH = 0;
      const baseY = yPos(0);

      // במובייל (seriesIds=['__total__']) — עמודה יחידה בסה"כ
      const effectiveSegments = isMobile
        ? [col.total]
        : col.segments;

      // בנה סגמנטים מלמטה למעלה — כל סגמנט מלבן עם 2px gap
      const segs = [];
      effectiveSegments.forEach((val, si) => {
        if (val <= 0) return;
        const segH = (val / yMax) * plotH;
        segs.push({ val, si, segH, y: baseY - cumulH - segH });
        cumulH += segH;
      });

      const totalH = cumulH;
      const rx = Math.min(4, BAR_W / 2);
      const x  = xPos(i) - BAR_W / 2;

      segs.forEach(({ val, si, segH, y }, idx) => {
        const isTop = idx === segs.length - 1;

        // הסגמנט עצמו
        bars += `<rect class="rev-seg" data-col="${i}" data-si="${si}"
          x="${x}" y="${y}" width="${BAR_W}" height="${segH}"
          fill="${colors[si % colors.length]}" style="cursor:pointer;transition:opacity .1s;"/>`;

        // 2px surface gap בראש כל סגמנט שאינו התחתון ביותר —
        // segs בנויים מלמטה למעלה; idx=0 הוא התחתון, idx>0 הוא מעליו.
        // ה-joint בין idx ל-idx-1 נמצא ב-y של idx (top של הסגמנט הנוכחי).
        if (idx > 0 && segH > GAP) {
          bars += `<rect x="${x}" y="${y}" width="${BAR_W}" height="${GAP}" fill="${SURFACE}" pointer-events="none"/>`;
        }
      });

      // עיגול פינות עליון — overlay rect ברוחב מלא ב-rx * 2 מהחלק העליון
      if (totalH > rx && segs.length > 0) {
        const topY   = baseY - totalH;
        const topSi  = segs[segs.length - 1].si;
        bars += `<rect x="${x}" y="${topY}" width="${BAR_W}" height="${rx * 2}"
          rx="${rx}" ry="${rx}"
          fill="${colors[topSi % colors.length]}"
          pointer-events="none"/>`;
      }

      xLabels += `<text x="${xPos(i)}" y="${yPos(0) + 16}" text-anchor="middle" fill="var(--text-muted)" font-size="11">${col.label}</text>`;
    });

    // crosshair
    const crosshair = `<line id="crosshair" x1="0" x2="0" y1="${PAD.top}" y2="${yPos(0)}"
      stroke="var(--baseline)" stroke-width="1" stroke-dasharray="4 3" opacity="0" pointer-events="none"/>`;

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('height', H);
    svg.innerHTML = gridLines + baseline + crosshair + bars + yLabels + xLabels;

    // hover — tooltip
    let activeCol = -1;

    function showTip(colIdx, anchor) {
      if (activeCol === colIdx) return;
      activeCol = colIdx;
      const col = data[colIdx];

      const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      // בנה תוכן tooltip
      const rows = isMobile
        ? `<div class="tt-row">
            <div class="tt-dot" style="background:${colors[0]}"></div>
            <span class="tt-val">${fmtILS(col.total)}</span>
           </div>`
        : seriesIds.map((id, si) => {
            const v = col.segments[si];
            if (v <= 0) return '';
            return `<div class="tt-row">
              <div class="tt-dot" style="background:${colors[si % colors.length]}"></div>
              <span class="tt-name">${esc(seriesNames[si])}</span>
              <span class="tt-val">${fmtILS(v)}</span>
            </div>`;
          }).join('');

      tooltip.innerHTML = `
        <div class="tt-month">${col.label}</div>
        ${rows}
        ${!isMobile && seriesIds.length > 1 ? `<div class="tt-total"><span>סה"כ</span><span>${fmtILS(col.total)}</span></div>` : ''}`;
      tooltip.classList.add('visible');

      // מיקום
      const wrapRect = wrap.getBoundingClientRect();
      const anchorRect = anchor.getBoundingClientRect();
      const ttW = tooltip.offsetWidth || 160;
      let left = anchorRect.left - wrapRect.left + BAR_W / 2 - ttW / 2;
      left = Math.max(4, Math.min(left, wrap.clientWidth - ttW - 4));
      const top  = anchorRect.top - wrapRect.top - (tooltip.offsetHeight || 80) - 8;
      tooltip.style.left = left + 'px';
      tooltip.style.top  = Math.max(4, top) + 'px';

      // crosshair
      const ch = svg.getElementById('crosshair');
      ch.setAttribute('x1', xPos(colIdx));
      ch.setAttribute('x2', xPos(colIdx));
      ch.setAttribute('opacity', '1');

      // עמם עמודות אחרות
      svg.querySelectorAll('.rev-seg').forEach(el => {
        el.style.opacity = parseInt(el.dataset.col) === colIdx ? '1' : '0.35';
      });
    }

    function hideTip() {
      activeCol = -1;
      tooltip.classList.remove('visible');
      svg.getElementById('crosshair').setAttribute('opacity', '0');
      svg.querySelectorAll('.rev-seg').forEach(el => { el.style.opacity = '1'; });
    }

    // hit targets — rect רחב לכל עמודה
    data.forEach((col, i) => {
      const hitX = xPos(i) - BAR_GAP / 2;
      const hit  = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      hit.setAttribute('x', hitX);
      hit.setAttribute('y', PAD.top);
      hit.setAttribute('width', BAR_GAP);
      hit.setAttribute('height', plotH);
      hit.setAttribute('fill', 'transparent');
      hit.style.cursor = 'pointer';
      hit.setAttribute('tabindex', '0');
      hit.setAttribute('role', 'img');
      hit.setAttribute('aria-label', `${col.label}: ${fmtILS(col.total)}`);
      hit.addEventListener('pointerenter', () => showTip(i, hit));
      hit.addEventListener('pointermove',  () => showTip(i, hit));
      hit.addEventListener('pointerleave', hideTip);
      hit.addEventListener('focus',        () => showTip(i, hit));
      hit.addEventListener('blur',         hideTip);
      svg.appendChild(hit);
    });

    // redraw on resize
    if (svg._ro) svg._ro.disconnect();
    svg._ro = new ResizeObserver(() => {
      const newW = wrap.clientWidth;
      const crossedBreakpoint = (newW < 500) !== isMobile;
      if (newW !== W) {
        hideTip();
        if (crossedBreakpoint) {
          // מעבר בין mobile/desktop — rebuild legend גם
          const legendEl = document.getElementById('chartLegend');
          if (newW < 500) {
            legendEl.innerHTML = '';
            drawRevenueChart(data, ['__total__'], ['סה"כ']);
          } else {
            const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const colors2 = slotColors();
            legendEl.innerHTML = seriesIds.map((id, si) =>
              `<div class="chart-legend-item">
                <div class="chart-legend-swatch" style="background:${colors2[si % colors2.length]}"></div>
                <span>${esc(seriesNames[si])}</span>
              </div>`
            ).join('');
            drawRevenueChart(data, seriesIds, seriesNames);
          }
        } else {
          drawRevenueChart(data, seriesIds, seriesNames);
        }
      }
    });
    svg._ro.observe(wrap);
  }

  async function syncCalendar() {
    const btn = document.getElementById('syncBtn');
    const status = document.getElementById('syncStatus');
    btn.disabled = true;
    btn.textContent = '⏳ מסנכרן...';
    try {
      const [syncRes, pushRes] = await Promise.all([
        fetch('/api/calendar/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(r => r.json()),
        fetch('/api/calendar/push', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(r => r.json()),
      ]);
      if (syncRes.success) {
        const dedupeRes = await fetch('/api/calendar/deduplicate', { method: 'POST' }).then(r => r.json());
        const removedMsg = dedupeRes.removed > 0 ? `, נוקו ${dedupeRes.removed} כפילויות` : '';
        status.textContent = `סונכרן בהצלחה — יובאו ${syncRes.imported}, נדחפו ${pushRes.pushed ?? 0}${removedMsg}`;
        status.style.color = '#276749';
        loadTodaySessions();
      } else {
        status.textContent = 'שגיאה בסינק: ' + (syncRes.error || 'לא ידוע');
        status.style.color = '#e53e3e';
      }
    } catch (e) {
      status.textContent = 'שגיאת רשת';
      status.style.color = '#e53e3e';
    }
    btn.disabled = false;
    btn.textContent = '🔄 סנכרן עכשיו';
  }

  async function deduplicateSessions() {
    const btn = document.getElementById('dedupeBtn');
    const status = document.getElementById('syncStatus');
    btn.disabled = true;
    btn.textContent = '⏳ בודק...';
    try {
      const res = await fetch('/api/calendar/deduplicate', { method: 'POST' }).then(r => r.json());
      if (res.success) {
        status.textContent = res.removed > 0
          ? `נוקו ${res.removed} פגישות כפולות (${res.groups} קבוצות)`
          : 'לא נמצאו כפילויות';
        status.style.color = res.removed > 0 ? '#276749' : '#718096';
        if (res.removed > 0) loadTodaySessions();
      } else {
        status.textContent = 'שגיאה: ' + (res.error || 'לא ידוע');
        status.style.color = '#e53e3e';
      }
    } catch (e) {
      status.textContent = 'שגיאת רשת';
      status.style.color = '#e53e3e';
    }
    btn.disabled = false;
    btn.textContent = '🧹 נקה כפילויות';
  }
</script>
